name: Test, build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_BACKEND: ghcr.io/hamon-e/perf-gdo-backend
  IMAGE_FRONTEND: ghcr.io/hamon-e/perf-gdo-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests backend
        run: |
          pip install -r apps/backend/requirements-dev.txt
          API_DB="sqlite:///:memory:" PYTHONPATH=apps/backend pytest -q apps/backend/tests

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: pnpm/action-setup@v4
        with:
          version: 7

      - name: Tests frontend
        run: |
          pnpm --dir apps/frontend install --frozen-lockfile
          CI=true NODE_OPTIONS=--openssl-legacy-provider \
            pnpm --dir apps/frontend test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build et push frontend
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          build-args: REACT_APP_API_BASE_URL=/api
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement sur perf-gdo
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/deploy_key <<< "$SSH_KEY"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@gdo.bot.nu \
            "set -e
             cd /opt/gdo
             git pull --ff-only
             export IMAGE_TAG=$IMAGE_TAG
             docker compose -f deploy/compose.prod.yaml --project-directory /opt/gdo pull backend frontend
             docker compose -f deploy/compose.prod.yaml --project-directory /opt/gdo up -d --remove-orphans
             docker image prune -f"
